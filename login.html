<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sambat Warga</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <a class="back-link" href="index.html">← Kembali ke Sambat Warga</a>
    <section class="card auth-card">
      <div class="auth-logo">🦺</div>
      <span class="eyebrow">AREA PETUGAS</span>
      <h1>Login Kartar / RT</h1>
      <p>Halaman ini khusus untuk petugas yang menerima dan menangani laporan warga.</p>

      <form id="loginForm">
        <label>
          Email
          <input id="email" type="email" placeholder="contoh@email.com" required>
        </label>
        <label>
          Password
          <input id="password" type="password" placeholder="Password" required>
        </label>
        <button class="primary-btn" type="submit">Masuk Dashboard →</button>
        <p id="loginError" class="form-error"></p>
      </form>
    </section>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
